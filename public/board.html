<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Табло — кейсы хакатона</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #05070c;
    --stage: #0d1117;
    --panel: #161b22;
    --panel2: #1c2129;
    --border: #2d333b;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #7ee787;
    --danger: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", -apple-system, Roboto, Arial, sans-serif;
    color: var(--text);
  }

  /* Летербокс 16:9 — подстраивается и под широкие, и под высокие экраны */
  .stage {
    aspect-ratio: 16 / 9;
    width: 100vw; height: 100vh;
    background: var(--stage);
    display: flex; flex-direction: column;
    padding: clamp(14px, 1.6vw, 32px);
    gap: clamp(10px, 1.2vw, 22px);
  }
  @media (min-aspect-ratio: 16/9) {
    .stage { width: auto; }
  }
  @media (max-aspect-ratio: 16/9) {
    .stage { height: auto; }
  }

  .head { display: flex; align-items: flex-start; justify-content: space-between; flex: 0 0 auto; }
  .h-title { font-size: clamp(18px, 2.4vw, 34px); font-weight: 700; letter-spacing: -0.3px; }
  .h-sub { font-size: clamp(10px, 1vw, 15px); color: var(--muted); margin-top: 6px; max-width: 60vw; }
  .h-live { display: flex; align-items: center; gap: 8px; font-size: clamp(10px, 1vw, 15px); color: var(--muted); white-space: nowrap; }
  .dot { width: clamp(6px,0.7vw,10px); height: clamp(6px,0.7vw,10px); border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  .body { flex: 1; display: flex; gap: clamp(10px, 1.4vw, 26px); min-height: 0; }

  .grid {
    flex: 1; min-width: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: clamp(6px, 0.9vw, 14px);
  }

  .cell {
    background: var(--panel); border: 1px solid var(--tcolor, var(--border));
    border-radius: clamp(6px, 0.7vw, 12px);
    padding: clamp(6px, 0.9vw, 14px);
    display: flex; flex-direction: column; gap: clamp(3px, 0.4vw, 8px);
    min-height: 0; overflow: hidden;
  }
  .cell.full { opacity: .5; }
  .c-id {
    font-family: Consolas, monospace; font-size: clamp(8px, 0.85vw, 13px); font-weight: 700;
    color: var(--tcolor); background: var(--panel2); border-radius: 5px;
    padding: 1px 6px; width: fit-content;
  }
  .c-title {
    font-size: clamp(9px, 1.05vw, 15px); font-weight: 600; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    flex: 1;
  }
  .c-nums { display: flex; align-items: baseline; justify-content: space-between; }
  .c-left { font-size: clamp(14px, 1.9vw, 28px); font-weight: 700; color: var(--tcolor); }
  .c-of { font-size: clamp(8px, 0.8vw, 12px); color: var(--muted); }
  .c-meter { height: clamp(3px,0.35vw,6px); border-radius: 3px; background: var(--panel2); overflow: hidden; }
  .c-meter > div { height: 100%; background: var(--tcolor); }
  .cell.full .c-meter > div { background: var(--danger); }
  .c-full-tag { font-size: clamp(8px,0.8vw,12px); font-weight: 700; color: var(--danger); text-align: center; }

  .qr-panel {
    flex: 0 0 clamp(120px, 15vw, 260px);
    background: var(--panel); border: 1px solid var(--border); border-radius: clamp(8px,1vw,16px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px,1vw,16px);
    padding: clamp(8px, 1vw, 18px);
    text-align: center;
  }
  #qrcode { background: #fff; padding: clamp(6px,0.8vw,12px); border-radius: 10px; line-height: 0; }
  .qr-text { font-size: clamp(10px, 1.1vw, 16px); font-weight: 600; line-height: 1.35; }
  .qr-url { font-size: clamp(8px, 0.85vw, 12px); color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <div>
      <div class="h-title" id="ev-title">Кейсы хакатона</div>
      <div class="h-sub" id="ev-sub"></div>
    </div>
    <div class="h-live"><span class="dot"></span><span id="upd">Обновлено —</span></div>
  </div>

  <div class="body">
    <div class="grid" id="grid"></div>
    <div class="qr-panel">
      <div id="qrcode"></div>
      <div class="qr-text">Сканируй → выбирай кейс</div>
      <div class="qr-url" id="qr-url"></div>
    </div>
  </div>
</div>

<script>
  const url = location.origin + "/";
  document.getElementById("qr-url").textContent = url.replace(/^https?:\/\//, "");
  new QRCode(document.getElementById("qrcode"), {
    text: url, width: 160, height: 160,
    colorDark: "#0d1117", colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M,
  });

  const trackColor = {};
  const $ = (s) => document.querySelector(s);

  async function load() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      const state = await r.json();
      render(state);
    } catch (e) { /* следующий тик починит */ }
  }

  function render(state) {
    if (state.event) {
      $("#ev-title").textContent = state.event.title;
      $("#ev-sub").textContent = "Отклик команды блокирует кейс — свободные места видно в реальном времени";
    }
    for (const t of state.tracks) trackColor[t.id] = t.color;
    $("#upd").textContent = "Обновлено " + new Date(state.updatedAt).toLocaleTimeString("ru-RU");

    const grid = $("#grid");
    grid.innerHTML = "";
    for (const c of state.cases.slice().sort((a, b) => a.id.localeCompare(b.id))) {
      const cell = document.createElement("div");
      cell.className = "cell" + (c.full ? " full" : "");
      cell.style.setProperty("--tcolor", trackColor[c.track] || "#8b949e");
      const pct = Math.min(100, Math.round((c.taken / c.limit) * 100));
      cell.innerHTML =
        '<span class="c-id">' + c.id + "</span>" +
        '<div class="c-title">' + escapeHtml(c.title) + "</div>" +
        '<div class="c-nums"><span class="c-left">' + (c.full ? "0" : c.left) +
        '</span><span class="c-of">своб. из ' + c.limit + "</span></div>" +
        '<div class="c-meter"><div style="width:' + pct + '%"></div></div>' +
        (c.full ? '<div class="c-full-tag">МЕСТ НЕТ</div>' : "");
      grid.appendChild(cell);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (ch) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  load();
  setInterval(load, 3000);
</script>
</body>
</html>
