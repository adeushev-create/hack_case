<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Кейсы хакатона «Агент без границ» — запись команд</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

:root {
  --bg:            #080c08;
  --bg-card:       #0f140f;
  --bg-elevated:   #161d16;
  --border:        #222b21;
  --text:          #e4ece2;
  --text-dim:      #8fa08f;
  --text-mute:     #7d8d7d;

  --lime:          #c7f54a;
  --lime-rgb:      199,245,74;
  --danger:        #ff5a5a;
  --danger-rgb:    255,90,90;

  --font-d: 'Unbounded','SF Pro Display','Helvetica Neue',Arial,sans-serif;
  --font-b: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-m: 'SF Mono','Cascadia Code',Consolas,'Courier New',monospace;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-b);
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 50% at 8% 0%, rgba(var(--lime-rgb),.09), transparent),
    radial-gradient(ellipse 55% 55% at 92% 100%, rgba(255,120,73,.07), transparent);
}
.page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 36px 24px 80px; }

.hero { text-align: center; margin-bottom: 34px; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-m); font-size: 12px;
  letter-spacing: .18em; text-transform: uppercase;
  color: var(--lime); padding: 7px 18px;
  border: 1px solid rgba(var(--lime-rgb),.25); border-radius: 999px;
  background: rgba(var(--lime-rgb),.06); margin-bottom: 22px;
}
.badge-dot {
  width: 7px; height: 7px; background: var(--lime); border-radius: 50%;
  box-shadow: 0 0 8px rgba(var(--lime-rgb),1);
  animation: pulse 2.4s infinite;
}
.hero-title {
  font-family: var(--font-d); font-weight: 800;
  font-size: clamp(24px, 3.4vw, 38px);
  line-height: 1.15; letter-spacing: -.02em; margin-bottom: 14px;
}
.hero-title .accent { color: var(--lime); text-shadow: 0 0 60px rgba(var(--lime-rgb),.35); }
.hero-desc {
  font-size: 14.5px; color: var(--text-dim); line-height: 1.65;
  max-width: 700px; margin: 0 auto;
}

.stats {
  display: flex; justify-content: center; gap: 12px; margin: 26px 0 8px; flex-wrap: wrap;
  font-family: var(--font-m); font-size: 12px; color: var(--text-mute);
}
.stat {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 9px 16px;
}
.stat b { color: var(--text); font-family: var(--font-b); }

.track { margin-top: 40px; }
.track-head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px; border-radius: 10px 10px 0 0;
  background: var(--bg-elevated); border: 1px solid var(--border); border-bottom: none;
  position: relative; overflow: hidden;
}
.track-head::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--tcolor), transparent 80%);
}
.track-num {
  font-family: var(--font-m); font-size: 11px; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--tcolor); background: rgba(0,0,0,.25);
  padding: 3px 8px; border-radius: 4px; flex-shrink: 0;
}
.track-name { font-family: var(--font-d); font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  border: 1px solid var(--border); border-radius: 0 0 10px 10px; overflow: hidden;
}

.card {
  background: var(--bg-card); border-top: 1px solid var(--border); border-left: 1px solid var(--border);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;
  transition: background .18s;
}
.card:nth-child(-n+100) { }
.card:not(.full):hover { background: var(--bg-elevated); cursor: pointer; }
.card.full { opacity: .5; }
.case-id {
  font-family: var(--font-m); font-size: 11px; font-weight: 700;
  letter-spacing: .1em; color: var(--tcolor);
  background: rgba(0,0,0,.22); border-radius: 5px; padding: 3px 8px; width: fit-content;
}
.case-title {
  font-family: var(--font-d); font-size: 15px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em;
}
.case-short {
  font-size: 13px; color: var(--text-dim); line-height: 1.55; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.case-link {
  font-family: var(--font-m); font-size: 11px; letter-spacing: .05em;
  color: var(--tcolor); background: none; border: none; cursor: pointer;
  text-align: left; padding: 0; width: fit-content; text-transform: uppercase;
}
.case-link:hover { text-decoration: underline; }

.meter { height: 5px; border-radius: 3px; background: rgba(0,0,0,.3); overflow: hidden; }
.meter > div { height: 100%; border-radius: 3px; background: var(--tcolor); transition: width .4s; }
.meter.full > div { background: var(--danger); }
.slots {
  display: flex; justify-content: space-between; font-family: var(--font-m); font-size: 11px; color: var(--text-mute);
}
.slots b { color: var(--text); font-family: var(--font-b); }

.btn {
  appearance: none; border: 1px solid transparent; cursor: pointer; border-radius: 9px;
  padding: 10px 14px; font-size: 13.5px; font-weight: 600; font-family: var(--font-b);
  background: rgba(var(--lime-rgb),.14); border-color: rgba(var(--lime-rgb),.4); color: var(--lime);
  transition: filter .15s, background .15s;
}
.btn:hover { background: rgba(var(--lime-rgb),.24); }
.btn[disabled] { background: rgba(0,0,0,.2); border-color: var(--border); color: var(--text-mute); cursor: not-allowed; }
.badge-full {
  font-family: var(--font-m); font-size: 11px; font-weight: 700; letter-spacing: .06em;
  color: var(--danger); border: 1px solid rgba(var(--danger-rgb),.4); background: rgba(var(--danger-rgb),.08);
  border-radius: 6px; padding: 7px 10px; text-align: center; text-transform: uppercase;
}

.overlay {
  position: fixed; inset: 0; background: rgba(3,5,3,.75); display: none;
  align-items: center; justify-content: center; padding: 20px; z-index: 50;
}
.overlay.open { display: flex; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px;
  width: 100%; max-width: 460px; padding: 28px; position: relative; overflow: hidden;
}
.modal::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--tcolor, var(--lime)), transparent 55%);
}
.modal h2 { font-family: var(--font-d); font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.modal .mcase { color: var(--text-mute); font-family: var(--font-m); font-size: 12px; margin-bottom: 18px; }
.field { margin-bottom: 14px; }
.field label {
  display: block; font-family: var(--font-m); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-mute); margin-bottom: 6px;
}
.field input {
  width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 9px; color: var(--text); padding: 11px 12px; font-size: 14px; font-family: var(--font-b);
}
.field input:focus { outline: none; border-color: var(--lime); }
.field input[readonly] { color: var(--text-dim); background: rgba(0,0,0,.2); }
.team-hint { font-family: var(--font-m); font-size: 11px; margin-top: 6px; min-height: 14px; }
.team-hint.found { color: var(--lime); }
.team-hint.notfound { color: var(--text-mute); }
.mrow { display: flex; gap: 10px; margin-top: 20px; }
.btn-ghost {
  flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-mute);
  border-radius: 9px; padding: 10px; font-size: 14px; cursor: pointer; font-family: var(--font-b);
}
.btn-submit { flex: 2; }
.msg { margin-top: 12px; font-size: 13px; line-height: 1.4; display: none; border-radius: 8px; padding: 10px 12px; }
.msg.err { display: block; color: var(--danger); background: rgba(var(--danger-rgb),.1); }
.msg.ok { display: block; color: var(--lime); background: rgba(var(--lime-rgb),.1); }

.detail-modal { max-width: 600px; max-height: 82vh; overflow-y: auto; }
.detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.detail-section { margin-top: 18px; }
.detail-section h3 {
  font-family: var(--font-m); font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em;
  color: var(--text-mute); margin-bottom: 8px;
}
.detail-section p { font-size: 14px; line-height: 1.65; color: var(--text); }
.detail-slots { font-family: var(--font-m); font-size: 12px; color: var(--text-mute); margin-top: 4px; }
.close-x { margin-left: auto; background: none; border: none; color: var(--text-mute); font-size: 22px; cursor: pointer; line-height: 1; }

footer { margin-top: 60px; color: var(--text-mute); font-size: 12px; text-align: center; font-family: var(--font-m); }

@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.85); } }

@media (max-width: 640px) {
  .page { padding: 24px 14px 60px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="hero-badge"><span class="badge-dot"></span>Запись команд · live</div>
    <div class="hero-title" id="ev-title">Кейсы хакатона <span class="accent">«Агент без границ»</span></div>
    <p class="hero-desc" id="ev-subtitle">Загрузка…</p>
  </div>

  <div class="stats">
    <div class="stat">Команд записано: <b id="st-total">0</b></div>
    <div class="stat">Кейсов открыто: <b id="st-open">0</b></div>
    <div class="stat">Обновлено: <b id="st-upd">—</b></div>
  </div>

  <div id="tracks"></div>

  <footer>Одна команда — один кейс. Статус обновляется каждые 3 секунды.</footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="signup-modal">
    <h2>Запись на кейс</h2>
    <div class="mcase" id="m-case"></div>
    <form id="form">
      <div class="field">
        <label>Номер стола</label>
        <input name="table" type="number" min="1" max="150" required placeholder="Например: 42" />
      </div>
      <div class="field">
        <label>Название команды</label>
        <input name="team" maxlength="100" required placeholder="Подставится по номеру стола" />
        <div class="team-hint" id="team-hint"></div>
      </div>
      <div class="field">
        <label>Капитан (ФИО)</label>
        <input name="captain" maxlength="100" required placeholder="Иванов Иван" />
      </div>
      <div class="msg" id="msg"></div>
      <div class="mrow">
        <button type="button" class="btn-ghost" id="btn-cancel">Отмена</button>
        <button type="submit" class="btn btn-submit" id="btn-submit">Записаться</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="detail-overlay">
  <div class="modal detail-modal" id="detail-modal">
    <div class="detail-head">
      <span class="case-id" id="d-id"></span>
      <button class="close-x" id="d-close">×</button>
    </div>
    <h2 id="d-title"></h2>
    <div class="detail-slots" id="d-slots"></div>

    <div class="detail-section"><h3>Рабочая ситуация</h3><p id="d-situation"></p></div>
    <div class="detail-section"><h3>Задача команды</h3><p id="d-task"></p></div>
    <div class="detail-section"><h3>Что получает команда</h3><p id="d-gets"></p></div>
    <div class="detail-section"><h3>Что нужно сдать</h3><p id="d-deliver"></p></div>

    <div class="mrow">
      <button type="button" class="btn-ghost" id="d-close2">Закрыть</button>
      <button type="button" class="btn btn-submit" id="d-signup">Записаться</button>
    </div>
  </div>
</div>

<script>
  let state = null;
  let teamByTable = {};
  const $ = (s) => document.querySelector(s);

  async function loadTeams() {
    try {
      const r = await fetch("/api/teams", { cache: "no-store" });
      const j = await r.json();
      teamByTable = Object.fromEntries(j.teams.map((t) => [t.table, t.team]));
    } catch (e) { /* форма продолжит работать без автоподстановки */ }
  }

  async function load() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      state = await r.json();
      render();
    } catch (e) { /* следующий тик починит */ }
  }

  function render() {
    if (!state) return;
    if (state.event) {
      $("#ev-title").innerHTML = 'Кейсы хакатона <span class="accent">«Агент без границ»</span>';
      $("#ev-subtitle").textContent = state.event.subtitle;
    }
    $("#st-total").textContent = state.totalTeams;
    $("#st-open").textContent = state.cases.filter((c) => !c.full).length + " из " + state.cases.length;
    $("#st-upd").textContent = new Date(state.updatedAt).toLocaleTimeString("ru-RU");

    const host = $("#tracks");
    host.innerHTML = "";
    for (const t of state.tracks) {
      const cs = state.cases.filter((c) => c.track === t.id);
      if (!cs.length) continue;
      const sec = document.createElement("section");
      sec.className = "track";
      sec.style.setProperty("--tcolor", t.color);
      sec.innerHTML =
        '<div class="track-head"><span class="track-num">' + t.num +
        '</span><span class="track-name">' + t.name + "</span></div>";
      const grid = document.createElement("div");
      grid.className = "grid";
      for (const c of cs) grid.appendChild(card(c, t));
      sec.appendChild(grid);
      host.appendChild(sec);
    }
  }

  function card(c, t) {
    const d = document.createElement("div");
    d.className = "card" + (c.full ? " full" : "");
    d.style.setProperty("--tcolor", t.color);
    const pct = Math.min(100, Math.round((c.taken / c.limit) * 100));
    d.innerHTML =
      '<span class="case-id">' + c.id + "</span>" +
      '<div class="case-title">' + escapeHtml(c.title) + "</div>" +
      '<div class="case-short">' + escapeHtml(c.situation) + "</div>" +
      '<button type="button" class="case-link">Подробнее →</button>' +
      '<div class="meter' + (c.full ? " full" : "") + '"><div style="width:' + pct + '%"></div></div>' +
      '<div class="slots"><span>Занято: <b>' + c.taken + " / " + c.limit +
      "</b></span><span>Свободно: <b>" + c.left + "</b></span></div>";
    d.querySelector(".case-link").onclick = () => openDetail(c);
    if (c.full) {
      const b = document.createElement("div");
      b.className = "badge-full";
      b.textContent = "Запись закрыта";
      d.appendChild(b);
    } else {
      const b = document.createElement("button");
      b.className = "btn";
      b.textContent = "Записаться";
      b.onclick = () => openModal(c, t);
      d.appendChild(b);
    }
    return d;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (ch) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  let selectedCase = null;
  function openModal(c, t) {
    selectedCase = c;
    $("#signup-modal").style.setProperty("--tcolor", t ? t.color : "#c7f54a");
    $("#m-case").textContent = c.id + " · " + c.title;
    $("#msg").className = "msg";
    $("#form").reset();
    updateTeamField();
    $("#overlay").classList.add("open");
  }
  function closeModal() { $("#overlay").classList.remove("open"); }
  $("#btn-cancel").onclick = closeModal;
  $("#overlay").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeModal(); });

  function updateTeamField() {
    const form = $("#form");
    const table = Number.parseInt(form.table.value, 10);
    const hint = $("#team-hint");
    if (!table) {
      form.team.value = "";
      form.team.readOnly = false;
      hint.className = "team-hint";
      hint.textContent = "";
      return;
    }
    const found = teamByTable[table];
    if (found) {
      form.team.value = found;
      form.team.readOnly = true;
      hint.className = "team-hint found";
      hint.textContent = "Найдено в реестре ✓";
    } else {
      form.team.value = "";
      form.team.readOnly = false;
      hint.className = "team-hint notfound";
      hint.textContent = "Стол не найден в реестре — впишите название команды вручную";
    }
  }
  $("#form").table.addEventListener("input", updateTeamField);

  function openDetail(c) {
    const t = state.tracks.find((x) => x.id === c.track);
    $("#detail-modal").style.setProperty("--tcolor", t ? t.color : "#c7f54a");
    $("#d-id").textContent = c.id;
    $("#d-id").style.color = t ? t.color : "#c7f54a";
    $("#d-title").textContent = c.title;
    $("#d-slots").textContent =
      "Занято " + c.taken + " из " + c.limit + " · Свободно: " + c.left + (c.full ? " · запись закрыта" : "");
    $("#d-situation").textContent = c.situation;
    $("#d-task").textContent = c.task;
    $("#d-gets").textContent = c.gets;
    $("#d-deliver").textContent = c.deliver;
    const signupBtn = $("#d-signup");
    signupBtn.style.display = c.full ? "none" : "block";
    signupBtn.onclick = () => { closeDetail(); openModal(c, t); };
    $("#detail-overlay").classList.add("open");
  }
  function closeDetail() { $("#detail-overlay").classList.remove("open"); }
  $("#d-close").onclick = closeDetail;
  $("#d-close2").onclick = closeDetail;
  $("#detail-overlay").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeDetail(); });

  $("#form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const btn = $("#btn-submit");
    btn.disabled = true; btn.textContent = "Отправляем…";
    const msg = $("#msg");
    try {
      const r = await fetch("/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          caseId: selectedCase.id,
          table: f.table.value,
          team: f.team.value,
          captain: f.captain.value,
        }),
      });
      const j = await r.json();
      if (r.ok) {
        msg.className = "msg ok";
        msg.textContent = "Готово! Команда записана на кейс «" + j.caseTitle + "».";
        setTimeout(closeModal, 1800);
      } else {
        msg.className = "msg err";
        msg.textContent = j.error || "Что-то пошло не так.";
      }
    } catch {
      msg.className = "msg err";
      msg.textContent = "Сеть недоступна, попробуйте ещё раз.";
    } finally {
      btn.disabled = false; btn.textContent = "Записаться";
      load();
    }
  });

  load();
  loadTeams();
  setInterval(load, 3000);
</script>
</body>
</html>
